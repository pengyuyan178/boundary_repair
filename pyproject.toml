[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boundary-repair"
version = "0.2.0"
description = "Bounded implementation for boundary-oriented multimodal program repair"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
boundary-repair = "boundary_repair.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
boundary_repair = ["py.typed", "frontend/*.cjs"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["src"]
